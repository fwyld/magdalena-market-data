name: Update public market data

# Descarga series de mercado con licencia de redistribucion y publica SOLO data/live.json (+ historicos CSV).
# Modo publico (PUBLIC_MODE=1): excluye FMP, CZ App/ICE y cualquier analisis interno. Cepea (CC BY-NC 4.0) se publica con atribucion; ALLOW_NC=0 lo retira.
on:
  schedule:
    - cron: "17 11 * * 1-5"  # 05:17 Guatemala: corrida matutina
    - cron: "0 14 * * 1-5"   # 08:00 Guatemala: NY Fed, EIA, ECB, Banguat y Cepea del dia habil anterior
    - cron: "30 22 * * 1-5"  # 16:30 Guatemala: BCB (PTAX) y cierres del dia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # ref: main -> un re-run toma la punta actual de main, no el commit viejo del run original
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      - name: Fetch public series
        env:
          PUBLIC_MODE: "1"
          HISTORY_DIR: data/history
          ALLOW_NC: "1"
        run: python tools/update_live.py data/live.json

      - name: Validate JSON before publishing
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/live.json", encoding="utf-8"))
          assert d.get("publico") is True and d.get("schema") == 2 and len(d["sources"]) >= 10, "live.json invalido"
          banned = [k for k in d["sources"] if "fmp" in k or "mar27" in k]
          assert not banned and "cierres" not in d, f"series no publicables: {banned}"
          print("OK", len(d["sources"]), "series", d["generated"])
          PY

      - name: Commit only if the data changed
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "market data $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            # -X theirs: en un conflicto prevalece nuestro commit (live.json se regenera completo en cada corrida)
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push rechazado (intento $i); reintento"; sleep $((i * 5))
          done
          exit 1

      - name: Report source alerts (warnings; fail only if most sources are down)
        run: python tools/check_alerts.py data/live.json
